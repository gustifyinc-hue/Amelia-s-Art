<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your cart — Amelia's Art</title>
  <meta name="description" content="Review your handmade lamps and check out securely." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/index.html">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.2 1 2.5h6c0-1.3.3-1.8 1-2.5A6 6 0 0 0 12 3Z"/></svg>
        Amelia's Art
      </a>
      <nav class="nav">
        <a href="index.html#shop">Shop</a>
        <a href="index.html#story">My story</a>
        <a class="cart-link" href="cart.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          Cart <span class="cart-count" data-cart-count style="display:none">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="wrap block">
    <h1>Your cart</h1>

    <div id="cart-filled" hidden>
      <div class="cart-list" id="cart-list"></div>

      <div class="cart-summary">
        <div class="row"><span>Subtotal</span><span id="subtotal"></span></div>
        <div class="row"><span>Shipping</span><span>Free</span></div>
        <div class="row total"><span>Total</span><span id="total"></span></div>
        <button class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:16px">Checkout securely</button>
        <div class="error-box" id="error-box" hidden></div>
        <p class="checkout-note">You'll pay on Stripe's secure page. Cards, Apple&nbsp;Pay &amp; Google&nbsp;Pay accepted.</p>
      </div>
    </div>

    <div id="cart-empty" class="cart-empty" hidden>
      <h2>Your cart is empty.</h2>
      <p>Let's fix that.</p>
      <p><a class="btn btn-dark" href="index.html#shop">Browse the lamps</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span id="year"></span> Amelia's Art · made by hand</span>
      <span><a href="cart.html">Cart</a> · <a href="index.html#story">My story</a></span>
    </div>
  </footer>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const filled = document.getElementById('cart-filled');
    const empty = document.getElementById('cart-empty');
    const listEl = document.getElementById('cart-list');
    const errorBox = document.getElementById('error-box');

    function render() {
      const cart = readCart();
      if (cart.length === 0) {
        filled.hidden = true;
        empty.hidden = false;
        return;
      }
      filled.hidden = false;
      empty.hidden = true;

      listEl.innerHTML = cart.map((item) => {
        const p = findProduct(item.productId);
        const v = findVariant(p, item.variantId);
        if (!p || !v) return '';
        const lineCents = p.priceCents * item.qty;
        return `
          <div class="cart-item" data-pid="${p.id}" data-vid="${v.id}">
            <img class="thumb" src="${p.image}" alt="${p.name}" />
            <div>
              <h4>${p.name}</h4>
              <div class="meta">${v.name} · ${formatPrice(p.priceCents)} each</div>
              <div class="qty" style="margin-top:8px">
                <button type="button" data-act="dec" aria-label="Decrease quantity">&minus;</button>
                <input type="number" min="1" value="${item.qty}" aria-label="Quantity for ${p.name}" />
                <button type="button" data-act="inc" aria-label="Increase quantity">+</button>
              </div>
            </div>
            <div class="line-col">
              <span class="line-price">${formatPrice(lineCents)}</span>
              <button class="remove-btn" data-act="remove">Remove</button>
            </div>
          </div>`;
      }).join('');

      const subtotal = cartSubtotalCents();
      document.getElementById('subtotal').textContent = formatPrice(subtotal);
      document.getElementById('total').textContent = formatPrice(subtotal);
    }

    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const row = btn.closest('.cart-item');
      const pid = row.dataset.pid, vid = row.dataset.vid;
      const item = readCart().find((i) => i.productId === pid && i.variantId === vid);
      if (!item) return;
      const act = btn.dataset.act;
      if (act === 'inc') setQty(pid, vid, item.qty + 1);
      else if (act === 'dec') setQty(pid, vid, item.qty - 1);
      else if (act === 'remove') removeFromCart(pid, vid);
      render();
    });

    listEl.addEventListener('change', (e) => {
      const input = e.target.closest('input[type="number"]');
      if (!input) return;
      const row = input.closest('.cart-item');
      const qty = Math.max(1, parseInt(input.value, 10) || 1);
      setQty(row.dataset.pid, row.dataset.vid, qty);
      render();
    });

    document.getElementById('checkout-btn').addEventListener('click', (e) => {
      errorBox.hidden = true;
      startCheckout(e.currentTarget, { set textContent(v) { errorBox.textContent = v; errorBox.hidden = !v; } });
    });

    render();
  </script>
</body>
</html>
